# Versions known to work together: AGP 8.10 needs Gradle 8.11.1+ (CI uses
# 8.14.3, see .github/workflows/android.yml); the Compose compiler is the
# Kotlin plugin of the same version.
[versions]
agp = "8.10.1"
kotlin = "2.1.21"
coroutines = "1.10.2"
composeBom = "2025.05.01"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
navigation = "2.8.9"
browser = "1.8.0"
datastore = "1.1.7"
coreKtx = "1.16.0"
# The full emoji picker for reactions (a View); its resources need an AppCompat theme.
emojiPicker = "1.5.0"
appcompat = "1.7.0"
annotation = "1.9.1"
# Used as net.java.dev.jna:jna:<version>@aar (a catalog cannot say @aar).
jna = "5.17.0"
# UnifiedPush (docs/mobile.md, section 10): PushService and UnifiedPush.register.
unifiedpush = "3.3.5"
junit = "4.13.2"
# Android's org.json for the JVM unit tests (android.jar has only stubs).
json = "20250517"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"
# Screenshot tests on the JVM (layoutlib); this release is built for AGP 8.10,
# Kotlin 2.1.21 and compileSdk 36, as the app.
paparazzi = "2.0.0-alpha02"

[libraries]
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-emoji2-emojipicker = { group = "androidx.emoji2", name = "emoji2-emojipicker", version.ref = "emojiPicker" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
unifiedpush-connector = { group = "org.unifiedpush.android", name = "connector", version.ref = "unifiedpush" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
