[workspace]
resolver = "3"
members = [
    "crates/mtrx-core",
    "crates/mtrx-format",
    "crates/mtrx-cli",
    "crates/mtrx-app",
    "crates/mtrx-ffi",
    "crates/xtask",
]

[workspace.package]
version = "0.4.0-beta.5"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
mtrx-core = { path = "crates/mtrx-core" }
mtrx-format = { path = "crates/mtrx-format" }
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite", "local-server"] }
matrix-sdk-ui = "0.19.1"
# For the types of recovery key errors, which matrix-sdk does not re-export.
matrix-sdk-crypto = "0.19.1"
eyeball-im = "0.9.1"
imbl = "7.0.2"
futures-util = "0.3.34"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = "4.2.0"
directories = "6.0.0"
rand = "0.10.3"
url = "2"
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
chrono = "0.4.45"
tempfile = "3.27.0"
hmac = "0.13.0"
sha1 = "0.11.0"
# Same version and TLS backend as matrix-sdk's.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
sha2 = "0.11.1"
base64 = "0.23.1"

# Dependencies are slow unoptimized (store key derivation, crypto); our crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

# The mobile libraries (scripts/build-{ios,android}-ffi.sh): link-time
# optimized, so the static library holds only what the bindings use.
[profile.mobile]
inherits = "release"
lto = true
codegen-units = 1

# mitex 0.2.4 ignores a custom command spec when writing output; patched copy.
[patch.crates-io]
mitex = { path = "vendor/mitex" }
iced_core = { path = "vendor/iced_core" }
iced_graphics = { path = "vendor/iced_graphics" }
iced_widget = { path = "vendor/iced_widget" }
iced_winit = { path = "vendor/iced_winit" }
winit = { path = "vendor/winit" }
