[workspace]
resolver = "3"
members = ["crates/mtrx-core", "crates/mtrx-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mtrx-core = { path = "crates/mtrx-core" }
matrix-sdk = { version = "0.19.1", features = ["bundled-sqlite", "markdown"] }
matrix-sdk-ui = "0.19.1"
eyeball-im = "0.9.1"
imbl = "7.0.2"
futures-util = "0.3.34"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = "4.2.0"
directories = "6.0.0"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
rpassword = "7.5.4"
chrono = "0.4.45"
tempfile = "3.27.0"
hmac = "0.13.0"
sha1 = "0.11.0"

# Dependencies are slow unoptimized (store key derivation, crypto); our crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
