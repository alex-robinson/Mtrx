# Android app (apps/android): the Rust library and its Kotlin bindings, then
# a debug APK (artifact Mtrx-android-debug, signed with the runner's debug
# key) and the app's unit tests. Gradle is set up by version; no wrapper jar
# is committed.
name: Android

on:
  push:
    branches: [main, core-cli, mobile, mobile-android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the libraries and Kotlin bindings
        # The runner's newest NDK.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android-ffi.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Debug APK
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename the APK
        run: |
          mkdir -p target/mobile
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk target/mobile/Mtrx-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mtrx-android-debug
          path: target/mobile/Mtrx-android-debug.apk
          if-no-files-found: error
      - name: Unit tests
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/mtrx-ffi/build/reports
          if-no-files-found: ignore
