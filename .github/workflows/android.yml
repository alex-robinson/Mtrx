# Android app (apps/android): the Rust library and its Kotlin bindings, then
# a debug APK (artifact Mtrx-android-debug, signed with the runner's debug
# key), the app's unit tests, and on an emulator the APK started (artifact
# android-smoke) and the instrumented tests against a local Synapse (push
# notifications end to end). Gradle is set up by version; no wrapper jar is
# committed.
name: Android

on:
  # Each pull request runs once on its merge with main. A push to main only
  # builds the Rust library, to save the build cache that pull requests then
  # restore.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # On main only the Rust library, for the cache.
  WARM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: pull requests restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the libraries and Kotlin bindings
        # The runner's newest NDK.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-android-ffi.sh
      - uses: actions/setup-java@v4
        if: env.WARM != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.WARM != 'true'
        with:
          gradle-version: '8.14.3'
      - name: Debug APK
        if: env.WARM != 'true'
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename the APK
        if: env.WARM != 'true'
        run: |
          mkdir -p target/mobile
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk target/mobile/Mtrx-android-debug.apk
      - uses: actions/upload-artifact@v4
        if: env.WARM != 'true'
        with:
          name: Mtrx-android-debug
          path: target/mobile/Mtrx-android-debug.apk
          if-no-files-found: error
      - name: Unit tests
        if: env.WARM != 'true'
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Instrumented tests' APK
        if: env.WARM != 'true'
        working-directory: apps/android
        run: gradle --no-daemon --stacktrace :app:assembleDebugAndroidTest
      - name: Synapse
        if: env.WARM != 'true'
        # On the host's port 8008, which the emulator reaches as 10.0.2.2:8008.
        run: |
          # The container runs Synapse as uid 991; it writes to data/.
          mkdir -p testserver/data
          chmod 777 testserver/data
          testserver/run.sh
      - name: Enable KVM for the emulator
        if: env.WARM != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the app on an emulator, then the instrumented tests
        if: env.WARM != 'true'
        # x86_64, as the library is built for. The sign-in screen shows, the
        # process lives, no crash in the log; screenshot as an artifact. Then
        # the instrumented tests (push notifications against Synapse). Each
        # script line runs in a shell of its own.
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            scripts/android-smoke.sh target/mobile/Mtrx-android-debug.apk
            cd apps/android && gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' && env.WARM != 'true' }}
        with:
          name: android-smoke
          path: target/smoke
          if-no-files-found: error
      - name: Synapse log
        if: failure() && env.WARM != 'true'
        run: docker logs mtrx-synapse 2>&1 | tail -100
      - uses: actions/upload-artifact@v4
        if: failure() && env.WARM != 'true'
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports
            apps/android/app/build/outputs/androidTest-results
            apps/android/mtrx-ffi/build/reports
          if-no-files-found: ignore
