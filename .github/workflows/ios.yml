# iOS app: built on the Rust library for the simulator, unit-tested there,
# its key screens drawn with made-up data (ios-screenshots), started there
# once (screenshot), and the simulator app (Mtrx.app, zipped) uploaded. Signed ad hoc (the simulator's default): the Keychain refuses an
# unsigned app.
name: iOS

on:
  # Each pull request runs once on its merge with main. A push to main only
  # builds the Rust library, to save the build cache that pull requests then
  # restore.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # On main only the Rust library, for the cache.
  WARM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  ios:
    # Apple silicon: the library's simulator slice is arm64 only.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: pull requests restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ios
      - name: Build the xcframework and Swift bindings
        run: scripts/build-ios-ffi.sh
      - name: Build the app for the simulator
        if: env.WARM != 'true'
        working-directory: apps/ios
        run: |
          xcodebuild build -project Mtrx.xcodeproj -scheme Mtrx -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -quiet
      - name: Choose a simulator
        if: env.WARM != 'true'
        # The first available iPhone, whichever the runner has.
        run: |
          device=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [[ -z "$device" ]]; then
            xcrun simctl list devices available
            echo "No iPhone simulator" >&2
            exit 1
          fi
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - name: Unit tests
        if: env.WARM != 'true'
        working-directory: apps/ios
        run: |
          xcodebuild test -project Mtrx.xcodeproj -scheme Mtrx \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -quiet \
            -skip-testing:MtrxTests/ScreenshotTests
      - name: Screenshots
        if: env.WARM != 'true'
        # The key screens with made-up data, as PNGs (artifact ios-screenshots);
        # the test runner gets SCREENSHOTS_DIR.
        working-directory: apps/ios
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/screenshots"
          TEST_RUNNER_SCREENSHOTS_DIR="$GITHUB_WORKSPACE/target/screenshots" \
            xcodebuild test -project Mtrx.xcodeproj -scheme Mtrx \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -quiet \
            -only-testing:MtrxTests/ScreenshotTests
          ls "$GITHUB_WORKSPACE/target/screenshots"
      - name: Start the app in the simulator
        if: env.WARM != 'true'
        # The Release app runs for 15 s without crashing; screenshot as an
        # artifact (the sign-in screen, as no account is saved).
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" apps/ios/build/Build/Products/Release-iphonesimulator/Mtrx.app
          pid=$(xcrun simctl launch "$DEVICE" org.mtrx.Mtrx | awk '{print $NF}')
          sleep 15
          mkdir -p target/smoke
          xcrun simctl io "$DEVICE" screenshot target/smoke/ios-simulator.png
          if ls ~/Library/Logs/DiagnosticReports/Mtrx[-_]*.ips 2>/dev/null; then
            echo "Mtrx crashed" >&2
            exit 1
          fi
          # launchctl lists the app's job with its pid while it runs.
          xcrun simctl spawn "$DEVICE" launchctl list \
            | awk -v pid="$pid" '$1 == pid && $3 ~ /^UIKitApplication:org\.mtrx\.Mtrx/ { found = 1 } END { exit !found }' \
            || { echo "Mtrx (pid $pid) is not running" >&2; exit 1; }
          xcrun simctl terminate "$DEVICE" org.mtrx.Mtrx
      - name: Package
        if: env.WARM != 'true'
        run: |
          mkdir -p target/mobile
          ditto -c -k --sequesterRsrc --keepParent \
            apps/ios/build/Build/Products/Release-iphonesimulator/Mtrx.app \
            target/mobile/Mtrx-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        if: env.WARM != 'true'
        with:
          name: Mtrx-ios-simulator
          path: target/mobile/Mtrx-ios-simulator.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && env.WARM != 'true'
        with:
          name: ios-smoke
          path: target/smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && env.WARM != 'true'
        with:
          name: ios-screenshots
          path: target/screenshots
          if-no-files-found: ignore
