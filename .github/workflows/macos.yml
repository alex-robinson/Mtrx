# macOS: lint, test and package (Mtrx.app, zipped).
name: macOS

on:
  # Each pull request runs once on its merge with main. A push to main only
  # builds, to save the build cache that pull requests then restore.
  # Packages come from the release workflow on a tag.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # From the release workflow, for the package.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # On main only the build, for the cache; packages on a tag or by hand.
  WARM: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

jobs:
  macos:
    # Apple silicon.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved from main only: pull requests restore it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        if: env.WARM != 'true'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace ${{ env.WARM == 'true' && '--no-run' || '' }}
      # The self-signed certificate the app is signed with, so the keychain
      # keeps trusting it across updates (from `scripts/make-sign-cert.sh`).
      # Without it the app is signed ad hoc.
      - name: Signing certificate
        if: env.PACKAGE == 'true'
        env:
          MTRX_MACOS_CERT: ${{ secrets.MTRX_MACOS_CERT }}
          MTRX_MACOS_CERT_PASSWORD: ${{ secrets.MTRX_MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MTRX_MACOS_CERT" ]; then echo "No certificate: signed ad hoc."; exit 0; fi
          keychain="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MTRX_MACOS_CERT" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" \
            -P "$MTRX_MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "MTRX_SIGN_IDENTITY=Mtrx" >> "$GITHUB_ENV"
      - name: Package
        if: env.PACKAGE == 'true'
        run: |
          cargo xtask bundle
          ditto -c -k --sequesterRsrc --keepParent target/bundle/Mtrx.app target/bundle/Mtrx-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: Mtrx-macos-arm64
          path: target/bundle/Mtrx-macos-arm64.zip
          if-no-files-found: error
