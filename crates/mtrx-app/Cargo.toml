[package]
name = "mtrx-app"
description = "Mtrx desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mtrx-app"
path = "src/main.rs"

[dependencies]
mtrx-core.workspace = true
mtrx-format = { workspace = true, features = ["render"] }
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "canvas", "advanced"] }
tokio.workspace = true
futures-util.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open = "5.4.4"
# Updates: GitHub's list of releases, and comparing their versions.
reqwest.workspace = true
semver = "1.0.28"
# Updates: checking the release files' signatures (`cargo xtask sign`).
ed25519-dalek = "3.0.0"
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1.13.3"
# Finding text without its accents (⌘F).
unicode-normalization = "0.1.26"
# Same version as typst-render's, for previewing PDFs.
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify-rust = "4.18.2"
rfd = "0.17.2"
# Same version as iced's, for the window icon.
resvg = "0.45.1"
emojis = "0.9.1"
# Pictures on the clipboard (iced's clipboard holds text only).
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
# Rich text pasted into the composer, as Markdown.
htmd = "0.5.6"
# Same version as iced's: the text layout of its paragraphs, for selecting.
iced_graphics = "0.14.0"

# The unread count on the Dock icon; the app's light or dark appearance;
# the displays, to open the window on one; the menu bar.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSDockTile", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSScreen", "NSTextFinder", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

# The unread count on the taskbar button; the monitors, to open the window
# on one.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Icon and version information in the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
# The standard actions of the menus (our `iced_core`), which iced does not
# re-export.
iced_core = "0.14.0"
iced_runtime = "0.14.0"
iced_test = "0.14.0"
mtrx-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
